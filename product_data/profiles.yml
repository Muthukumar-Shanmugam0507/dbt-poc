product-data:
  target: "{{ env_var('DBT_TARGET') }}"
  outputs:
    product_data_eng:
      account: fbb.us-east-1
      database: DS_PROJECTS
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 1
      type: snowflake
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      warehouse: DS_ANALYTICS
    product_data_model:
      account: fbb.us-east-1
      database: DS_PROJECTS
      private_key: "{{ env_var('PDM_PRIVATE_KEY') }}"
      role: PRODUCT_DATA_MODEL
      schema: PRODUCT_DATA_MANAGEMENT
      threads: 1
      type: snowflake
      user: SVC_PDM_USER
      warehouse: DS_ANALYTICS